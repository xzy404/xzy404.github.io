<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XPating - OI 主题绘画</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome/css/font-awesome.min.css">
</head>
<body class="bg-gray-50 flex min-h-screen overflow-x-hidden">

    <aside id="sidebar" class="fixed left-0 top-0 h-screen bg-slate-900 text-slate-100 z-50 transition-all duration-300 w-16 hover:w-64 group shadow-xl overflow-hidden flex flex-col justify-between">
        <div class="p-4 flex flex-col h-full">
            <a href="https://xzy404.github.io" class="text-3xl font-black tracking-wider block mb-10 font-mono text-teal-400 select-none whitespace-nowrap pl-2">
                X<span class="opacity-0 group-hover:opacity-100 transition-opacity duration-300 text-transparent bg-clip-text bg-gradient-to-r from-teal-400 to-blue-500">Pating</span>
            </a>
            
            <nav class="space-y-2 flex-1">
                <a href="#/" id="nav-home" class="flex items-center space-x-4 px-3 py-3 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition-all duration-200">
                    <i class="fa-solid fa-house text-lg w-6 text-center"></i>
                    <span class="sidebar-text opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">公共画板</span>
                </a>
                <a href="#/draw" id="nav-draw" class="flex items-center space-x-4 px-3 py-3 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition-all duration-200">
                    <i class="fa-solid fa-palette text-lg w-6 text-center"></i>
                    <span class="sidebar-text opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">词条绘画区</span>
                </a>
                
                <hr class="border-slate-800 my-4">
                
                <div class="sidebar-text opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                    <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider px-2 mb-2 whitespace-nowrap">往期展览</p>
                    <div class="space-y-1 max-h-60 overflow-y-auto px-1" id="past-terms-list">
                        </div>
                </div>
            </nav>

            <button onclick="toggleConfigModal()" class="flex items-center space-x-4 px-3 py-3 rounded-lg text-slate-500 hover:bg-slate-800 hover:text-teal-400 transition-all duration-200 cursor-pointer w-full text-left">
                <i class="fa-solid fa-gear text-lg w-6 text-center"></i>
                <span class="sidebar-text opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">配置 GitHub 令牌</span>
            </button>
        </div>
    </aside>

    <main class="flex-1 pl-16 p-8 box-border transition-all duration-300" id="main-content">
        </main>

    <div id="lightbox" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4 cursor-zoom-out" onclick="closeLightbox()">
        <img id="lightbox-img" class="max-w-full max-h-full rounded-lg shadow-2xl transition-transform duration-300" src="" alt="Zoomed View">
    </div>

    <div id="config-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl p-6 max-w-md w-full shadow-2xl">
            <h3 class="text-xl font-bold text-slate-800 mb-2">🔧 GitHub API 凭证配置</h3>
            <p class="text-xs text-slate-500 mb-4">因为本站为纯静态页面，上传画作与投票需要调用您的 GitHub 权限。数据将**仅保存在您的本地浏览器中**。</p>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">GitHub 账户名 (Owner)</label>
                    <input type="text" id="cfg-owner" value="xzy404" class="w-full border p-2 rounded text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">仓库名称 (Repo)</label>
                    <input type="text" id="cfg-repo" value="xzy404.github.io" class="w-full border p-2 rounded text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">个人访问令牌 (PAT Token)</label>
                    <input type="password" id="cfg-token" placeholder="github_pat_..." class="w-full border p-2 rounded text-sm">
                </div>
            </div>
            <div class="mt-6 flex justify-end space-x-2">
                <button onclick="toggleConfigModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium rounded-lg">取消</button>
                <button onclick="saveConfig()" class="px-4 py-2 bg-teal-600 hover:bg-teal-700 text-white text-sm font-medium rounded-lg">保存配置</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>

    <script src="https://fastly.jsdelivr.net/gh/stevenjoezhang/live2d-widget@latest/autoload.js"></script>

</body>
</html>
