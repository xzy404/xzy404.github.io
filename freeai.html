<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的 AI 聊天室</title>
</head>
<body>
    <h2>AI 聊天助手</h2>
    
    <div>
        <label for="apiKey">输入你的 API Key:</label>
        <input type="password" id="apiKey" placeholder="sk-...">
    </div>

    <br>
    <textarea id="userInput" placeholder="问点什么吧..."></textarea>
    <button onclick="askAI()">发送</button>
    
    <div id="response" style="margin-top: 20px; white-space: pre-wrap; font-weight: bold;"></div>

    <script>
        async function askAI() {
            const apiKey = "sk-t7ySqimz7FePl3j99TQvinBsOmGIlOCq6cqoqrCKCtTP0jtH";
            const userInput = document.getElementById('userInput').value;
            const responseDiv = document.getElementById('response');

            if (!apiKey) {
                alert('请先输入 API Key！');
                return;
            }

            responseDiv.innerText = "思考中...";

            try {
                // 注意：这里使用的是标准的 OpenAI 接口路径，如果你使用的是中转 API，需要更换 URL
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'gpt-3.5-turbo', // 或者你拥有的其他模型权限
                        messages: [{ role: 'user', content: userInput }]
                    })
                });

                const data = await response.json();
                if (data.choices && data.choices[0]) {
                    responseDiv.innerText = data.choices[0].message.content;
                } else {
                    responseDiv.innerText = "出错了: " + JSON.stringify(data);
                }
            } catch (error) {
                responseDiv.innerText = "请求失败: " + error.message;
            }
        }
    </script>
</body>
</html>
